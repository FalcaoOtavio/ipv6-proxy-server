name: Tests and installer
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: bash -n install.sh && bash -n ipv6-proxy-server.sh && shellcheck install.sh tests/e2e/vm_e2e.sh
      - name: Install with systemd on loopback
        run: sudo bash install.sh --subnet fd00:1234::/64 --interface lo --ipv4 127.0.0.1
      - name: Test real 3proxy forwarding
        run: TEST_3PROXY_BINARY=/usr/local/bin/3proxy python -m pytest -q tests/test_3proxy_integration.py
      # Per-proxy units, CLI (create/rotate/edit/batch/delete), API restart without
      # proxy restarts, 0 3proxy in the API cgroup, idempotent re-run/--update/--cli-only.
      - name: Verify deployed CLI/API, restarts and installer re-runs
        run: sudo python3 tests/smoke_deployment.py "$PWD/install.sh"
      - name: Service logs on failure
        if: failure()
        run: sudo journalctl -u ipv6-proxy-api -u 'ipv6-proxy@*' --no-pager -n 200
